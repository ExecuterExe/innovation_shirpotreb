<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ВПАРИТЬ — сделай бред инвестицией</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta name="theme-color" content="#0a0a0a">


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Montserrat:wght@700;800;900&family=JetBrains+Mono:wght@500;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <!-- Tailwind собран заранее (npm run build:css) — раньше компилировался в браузере на каждое обновление экрана.
         Подключён после style.css, как и раньше делал CDN: порядок каскада тот же. -->
    <link rel="stylesheet" href="css/tailwind.css">

    <!-- Яндекс.Метрика. Заведите счётчик на metrika.yandex.ru, вставьте его номер
         в YM_ID — и появятся посещаемость, источники трафика, устройства и Вебвизор.
         Пока YM_ID пустой, код не грузится и ничего не отправляется. -->
    <script>
        (function () {
            var YM_ID = ''; // ← сюда номер счётчика, например 98765432
            if (!YM_ID) return;
            (function (m, e, t, r, i, k, a) {
                m[i] = m[i] || function () { (m[i].a = m[i].a || []).push(arguments) };
                m[i].l = 1 * new Date();
                k = e.createElement(t), a = e.getElementsByTagName(t)[0];
                k.async = 1; k.src = r; a.parentNode.insertBefore(k, a)
            })(window, document, 'script', 'https://mc.yandex.ru/metrika/tag.js', 'ym');
            ym(YM_ID, 'init', { clickmap: true, trackLinks: true, accurateTrackBounce: true, webvisor: true });
        })();
    </script>
</head>

<body class="bg-corp-black text-corp-text font-body min-h-screen overflow-x-hidden antialiased">

    <canvas id="particles-canvas" class="fixed inset-0 z-0 pointer-events-none"></canvas>

    <div id="app" class="relative z-10"></div>

    <div id="notification-container" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 pointer-events-none"></div>

    <div id="action-toast-container"></div>

    <div id="confetti-container" class="fixed inset-0 z-40 pointer-events-none"></div>

    <script type="module" src="js/app.js"></script>
</body>

</html>
